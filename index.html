
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flamengo x Palmeiras</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;text-align:center;color:white;
 font-family:Arial,sans-serif;
 background:linear-gradient(-45deg,#16030a,#b30b25,#042d19,#08783e);
 background-size:400% 400%;animation:fundo 8s infinite;
}
@keyframes fundo{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}
.container{padding:25px;width:100%;max-width:850px}
h1{font-size:clamp(30px,6vw,55px);text-transform:uppercase}
h1 span{color:#ffd166}
.times{display:flex;justify-content:center;align-items:center;gap:20px}
.time{padding:25px 15px;border-radius:20px;background:#0009;flex:1}
.escudo{font-size:90px}
button{padding:14px;border:0;border-radius:10px;color:white;
font-weight:bold;cursor:pointer;width:100%;font-size:15px}
.fla button{background:#d71935}
.pal button{background:#168447}
.vs{font-size:30px;font-weight:bold;color:#ffd166}
.resultado{margin-top:25px;background:#0009;padding:20px;border-radius:16px}
.barra{display:flex;height:22px;border-radius:20px;overflow:hidden}
#flamengo{background:#e31b32;width:50%}
#palmeiras{background:#168447;width:50%}
@media(max-width:550px){
 .times{gap:7px}.time{padding:15px 8px}
 .escudo{font-size:55px}.vs{font-size:20px}
 button{font-size:12px;padding:12px 4px}
}
</style>
</head>
<body>
<main class="container">
 <h1>Quem vai ganhar <span>o Brasileirão?</span></h1>
 <p>🔥 A batalha das torcidas 🔥</p>

 <div class="times">
  <section class="time fla">
   <div class="escudo">🦅</div>
   <h2>FLAMENGO</h2>
   <p>Urubu rubro-negro</p>
   <button onclick="votar('fla')">VOTAR NO MENGÃO</button>
  </section>

  <div class="vs">X</div>

  <section class="time pal">
   <div class="escudo">🐷</div>
   <h2>PALMEIRAS</h2>
   <p>Porco alviverde</p>
   <button onclick="votar('pal')">VOTAR NO VERDÃO</button>
  </section>
 </div>

 <section class="resultado">
  <h2>📊 Votação da torcida</h2>
  <div class="barra">
   <div id="flamengo"></div>
   <div id="palmeiras"></div>
  </div>
  <p id="placar">Flamengo 50% x 50% Palmeiras</p>
  <p id="mensagem">Quem será o campeão?</p>
  <p id="votos">Total de votos: 0</p>
 </section>
</main>

<script>
let fla=0,pal=0;
function votar(time){
 if(time==='fla')fla++;
 else pal++;

 let total=fla+pal;
 let pf=Math.round(fla/total*100);
 let pp=100-pf;

 document.getElementById('flamengo').style.width=pf+'%';
 document.getElementById('palmeiras').style.width=pp+'%';
 document.getElementById('placar').textContent=
 'Flamengo '+pf+'% x '+pp+'% Palmeiras';
 document.getElementById('votos').textContent=
 'Total de votos: '+total;
 document.getElementById('mensagem').textContent=
 pf===pp?'A disputa está empatada!':
 pf>pp?'Flamengo lidera a votação! 🔴⚫':
 'Palmeiras lidera a votação! 🟢';
}
</script>
</body>
</html>
