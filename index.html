<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flamengo x Palmeiras</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: transparent; color: white;
  font-family: Arial, sans-serif; text-align: center;
}
.placar {
  width: 700px; margin: 30px auto; padding: 24px;
  background: linear-gradient(135deg,#171717,#303030);
  border: 3px solid #d5b15b; border-radius: 22px;
  box-shadow: 0 0 25px #0008;
}
h1 { margin: 0 0 20px; font-size: 28px; }
.times {
  display: flex; align-items: center; justify-content: space-around;
  gap: 15px;
}
.time { width: 40%; }
.escudo { font-size: 55px; }
.nome { font-size: 23px; font-weight: bold; margin-top: 8px; }
.gols { font-size: 65px; font-weight: bold; margin: 15px; }
.x { font-size: 35px; color: #f5d779; }
button {
  border: 0; padding: 12px 16px; margin: 5px;
  border-radius: 8px; font-size: 16px; font-weight: bold;
  cursor: pointer;
}
.fla { background: #e32636; color: white; }
.pal { background: #16834a; color: white; }
.reset { background: #eee; color: #222; }
</style>
</head>
<body>
<div class="placar">
  <h1>🏆 FUTEBOL AO VIVO 🏆</h1>
  <div class="times">
    <div class="time">
      <div class="escudo">🔴⚫</div>
      <div class="nome">FLAMENGO</div>
      <div class="gols" id="flamengo">0</div>
    </div>
    <div class="x">X</div>
    <div class="time">
      <div class="escudo">🟢⚪</div>
      <div class="nome">PALMEIRAS</div>
      <div class="gols" id="palmeiras">0</div>
    </div>
  </div>
  <div>🔥 QUEM VAI VENCER? 🔥</div>
</div>
<div>
  <button class="fla" onclick="mudar('flamengo',1)">⚽ Gol Flamengo +</button>
  <button class="pal" onclick="mudar('palmeiras',1)">⚽ Gol Palmeiras +</button>
  <button class="reset" onclick="zerar()">Zerar placar</button>
</div>
<script>
function mudar(time, valor) {
  const el = document.getElementById(time);
  el.textContent = Number(el.textContent) + valor;
}
function zerar() {
  document.getElementById('flamengo').textContent = '0';
  document.getElementById('palmeiras').textContent = '0';
}
</script>
</body>
</html>
